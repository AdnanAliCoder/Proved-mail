# Replace provemails.example.com with your real domain.
# Configure TLS certificates with your preferred ACME/Let's Encrypt workflow first.
server {
    listen 80;
    server_name provemails.example.com www.provemails.example.com;
    client_max_body_size 55m;

    # If HTTPS is configured by Certbot, redirect HTTP to HTTPS here.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name provemails.example.com www.provemails.example.com;

    # Replace these with the actual certificate and key paths on this server.
    ssl_certificate /etc/letsencrypt/live/provemails.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provemails.example.com/privkey.pem;

    client_max_body_size 55m;
    proxy_read_timeout 180s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 180s;

    location /static/ {
        alias /home/ubuntu/Proved-mail/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Do not expose /media/ with an Nginx alias: it contains uploaded lead files.
    # Keep uploads private and serve exports only through authenticated Django views.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
